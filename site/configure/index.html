<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0e0d0b);scene.fog=new THREE.Fog(0x0e0d0b,8,16);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.03,60);camera.position.set(2.2,1.6,4.4);
const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.07;controls.target.set(0,1.3,0);
controls.minDistance=.35;controls.maxDistance=8;controls.maxPolarAngle=Math.PI*.56;controls.minAzimuthAngle=-1.35;controls.maxAzimuthAngle=1.35;
/* textures */
const rnd=(a,b)=>a+Math.random()*(b-a);
function ctex(w,h,draw,rep=[1,1]){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const plaster=ctex(512,512,(x,w,h)=>{x.fillStyle='#ececec';x.fillRect(0,0,w,h);for(let i=0;i<260;i++){const r=rnd(20,90),px=rnd(0,w),py=rnd(0,h),g=x.createRadialGradient(px,py,0,px,py,r);const v=Math.random()>.5?255:200;g.addColorStop(0,`rgba(${v},${v},${v},${rnd(.04,.1)})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2);}const d=x.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){const n=rnd(-9,9);d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n;}x.putImageData(d,0,0);},[2,1.2]);
const grain=ctex(512,128,(x,w,h)=>{x.fillStyle='#d8d8d8';x.fillRect(0,0,w,h);for(let i=0;i<70;i++){x.strokeStyle=`rgba(${rnd(80,140)|0},${rnd(60,100)|0},40,${rnd(.12,.32)})`;x.lineWidth=rnd(.5,2.2);x.beginPath();let y=rnd(0,h);x.moveTo(0,y);for(let X=0;X<=w;X+=16){y+=rnd(-1.6,1.6);x.lineTo(X,y);}x.stroke();}});
const engrave=ctex(256,128,(x,w,h)=>{x.fillStyle='#e8e8e8';x.fillRect(0,0,w,h);x.strokeStyle='rgba(60,60,60,.55)';for(let i=0;i<46;i++){x.lineWidth=rnd(.5,1.4);x.beginPath();x.arc(rnd(0,w),rnd(0,h),rnd(6,22),rnd(0,6),rnd(0,6));x.stroke();}});
const brushed=ctex(512,64,(x,w,h)=>{x.fillStyle='#dcdcdc';x.fillRect(0,0,w,h);for(let i=0;i<500;i++){x.strokeStyle=`rgba(${Math.random()>.5?255:150},${Math.random()>.5?255:150},${Math.random()>.5?255:150},.06)`;x.beginPath();const y=rnd(0,h);x.moveTo(0,y);x.lineTo(w,y+rnd(-.5,.5));x.stroke();}});
const wordTex=ctex(512,64,(x,w,h)=>{x.fillStyle='#efe6d6';x.font='400 36px "Cormorant Garamond", Georgia, serif';x.textAlign='center';x.textBaseline='middle';x.fillText('L  O  C  K  G',w/2,h/2+2);});

/* materials */
const M={walnut:new THREE.MeshStandardMaterial({color:0x4a2a16,map:grain,roughness:.36}),steel:new THREE.MeshStandardMaterial({color:0x26272a,metalness:.88,roughness:.36}),blued:new THREE.MeshStandardMaterial({color:0x1b1f27,metalness:.92,roughness:.28}),silver:new THREE.MeshStandardMaterial({color:0xb0aea7,map:engrave,metalness:1,roughness:.3}),brass:new THREE.MeshStandardMaterial({color:0xa6824d,metalness:1,roughness:.3}),poly:new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.72}),rubber:new THREE.MeshStandardMaterial({color:0x111111,roughness:.9})};
const shellM=new THREE.MeshPhysicalMaterial({color:0x8a6a43,metalness:.95,roughness:.3,map:brushed,clearcoat:.3,clearcoatRoughness:.3});
const darkM=new THREE.MeshStandardMaterial({color:0x121110,metalness:.6,roughness:.45});
const feltM=new THREE.MeshStandardMaterial({color:0x2a211a,roughness:1});
const ringM=new THREE.MeshStandardMaterial({color:0x111111,emissive:0x9c7a4e,emissiveIntensity:1});
const glassBlack=new THREE.MeshPhysicalMaterial({color:0x070707,roughness:.12,clearcoat:1});

/* helpers */
function mesh(g,m){const o=new THREE.Mesh(g,m);o.castShadow=o.receiveShadow=true;return o;}
function at(o,x,y,z=0){o.position.set(x,y,z);return o;}
function rbox(w,h,d,r,m){return mesh(new RoundedBoxGeometry(w,h,d,4,r),m);}
function box(w,h,d,m){return mesh(new THREE.BoxGeometry(w,h,d),m);}
function cylX(a,b,len,m,seg=28){const g=new THREE.CylinderGeometry(a,b,len,seg);g.rotateZ(-Math.PI/2);return mesh(g,m);}
function cylZ(r,len,m,seg=28){const g=new THREE.CylinderGeometry(r,r,len,seg);g.rotateX(Math.PI/2);return mesh(g,m);}
function extrude(pts,depth,m,bev=.006){const s=new THREE.Shape();s.moveTo(...pts[0]);pts.slice(1).forEach(p=>s.lineTo(...p));const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:4});g.translate(0,0,-depth/2);return mesh(g,m);}
function guard(x,y,m){const t=mesh(new THREE.TorusGeometry(.021,.0028,8,24,Math.PI),m);t.rotation.z=Math.PI;return at(t,x,y);}
function trig(x,y,m){const t=box(.004,.022,.006,m);t.rotation.z=.25;return at(t,x,y);}

/* weapons: t = trigger x, cx/cy = barrel lock point, by = butt bottom y */
const GUNS={
 ar:{name:'g_ar',t:.335,cx:.78,cy:.115},
 pump:{name:'g_pump',t:.415,cx:.98,cy:.104},
 bolt:{name:'g_bolt',t:.455,cx:1.0,cy:.1},
 lever:{name:'g_lever',t:.43,cx:.98,cy:.1}};
function buildGun(id){const g=new THREE.Group();
 if(id==='ar'){const P=M.poly,S=M.steel;
  g.add(extrude([[0,.02],[0,.125],[.02,.13],[.1,.115],[.1,.085],[.03,.04],[.02,.02]],.034,P,.006));
  g.add(at(cylX(.015,.015,.17,S),.17,.1));
  g.add(at(box(.2,.06,.03,P),.36,.07));
  g.add(at(box(.24,.035,.032,S),.38,.118));
  g.add(at(box(.02,.05,.028,S),.27,.112));
  const grip=box(.03,.085,.03,P);grip.rotation.z=.32;g.add(at(grip,.29,.005));
  const mag=box(.05,.14,.026,P);mag.rotation.z=-.18;g.add(at(mag,.405,-.025));
  g.add(guard(.335,.042,S));g.add(trig(.335,.035,S));
  const hg=cylX(.02,.02,.34,S,8);g.add(at(hg,.67,.118));
  for(let i=0;i<6;i++)g.add(at(box(.026,.006,.042,P),.55+i*.05,.118));
  g.add(at(cylX(.008,.009,.2,M.blued),.93,.118));
  g.add(at(cylX(.012,.012,.05,M.blued),1.04,.118));
  g.add(at(box(.07,.035,.026,P),.42,.155));g.add(at(cylX(.012,.012,.06,M.glass||P),.42,.175));}
 if(id==='bolt'){g.add(extrude([[0,.015],[0,.135],[.03,.142],[.30,.098],[.40,.086],[.80,.081],[.825,.068],[.825,.045],[.47,.038],[.43,0],[.395,-.006],[.37,.03],[.06,.012]],.036,M.walnut));g.add(at(box(.012,.12,.04,M.rubber),-.004,.075));g.add(at(cylX(.016,.016,.26,M.blued),.52,.1));g.add(at(cylX(.0082,.011,.54,M.blued),.91,.1));g.add(at(cylX(.013,.013,.3,M.steel),.53,.152));g.add(at(cylX(.022,.013,.075,M.steel),.71,.152));g.add(at(cylX(.013,.018,.05,M.steel),.36,.152));g.add(at(box(.014,.032,.022,M.steel),.45,.125));g.add(at(box(.014,.032,.022,M.steel),.61,.125));g.add(guard(.455,.045,M.blued));g.add(trig(.455,.035,M.steel));}
 if(id==='lever'){g.add(extrude([[0,.02],[0,.13],[.03,.136],[.33,.097],[.37,.09],[.37,.052],[.31,.044],[.06,.016]],.036,M.walnut));g.add(at(box(.012,.11,.04,M.brass),-.004,.074));g.add(at(box(.15,.062,.034,M.brass),.445,.086));g.add(at(cylX(.0095,.0105,.62,M.blued),.83,.1));g.add(at(cylX(.008,.008,.56,M.blued),.8,.075));g.add(at(box(.3,.03,.034,M.walnut),.67,.074));const lv=mesh(new THREE.TorusGeometry(.03,.0042,10,32),M.blued);lv.scale.set(1.25,.85,1);g.add(at(lv,.405,.03));g.add(trig(.43,.045,M.steel));}
 if(id==='pump'){g.add(extrude([[0,.015],[0,.132],[.03,.138],[.31,.096],[.38,.09],[.38,.05],[.35,0],[.32,0],[.305,.034],[.06,.012]],.038,M.poly,.008));g.add(at(box(.014,.12,.042,M.rubber),-.005,.073));g.add(at(box(.2,.066,.036,M.poly),.48,.086));g.add(at(cylX(.0115,.012,.64,M.steel),.9,.104));g.add(at(cylX(.0105,.0105,.46,M.steel),.8,.075));g.add(at(cylX(.019,.019,.2,M.poly),.75,.075));for(let i=0;i<7;i++)g.add(at(cylX(.0205,.0205,.006,M.rubber,24),.665+i*.028,.075));g.add(guard(.415,.042,M.poly));g.add(trig(.415,.032,M.steel));}
 return g;}

/* ---------- product (built along +X, then stood upright) ---------- */
const WZ=-.075, GY=-.055; // wall plane, gun local->product y offset
const floorM=new THREE.MeshStandardMaterial({color:0x2a211b,roughness:.8});
const product=new THREE.Group();scene.add(product);
const parts={};function part(n){const g=new THREE.Group();product.add(g);parts[n]=g;return g;}
const bolts=part('bolts'),rail=part('rail'),cradle=part('cradle'),cover=part('cover'),lockBody=part('lock'),gateP=part('gate'),gunHolder=part('gun');
const slotM=new THREE.MeshStandardMaterial({color:0x050505,roughness:.9});
// barrel ring helper
function halfRing(R,r,a0,a1,depth,m){const s=new THREE.Shape();s.absarc(0,0,R,a0,a1,false);s.absarc(0,0,r,a1,a0,true);const g=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:.002,bevelSize:.002,bevelSegments:3,curveSegments:32});g.translate(0,0,-depth/2);g.rotateY(Math.PI/2);return mesh(g,m);}
const CR=.036,cr=.024;
// cover hinge + gate pivot (rebuilt per gun)
const coverHinge=new THREE.Group();cover.add(coverHinge);
const gatePivot=new THREE.Group();gateP.add(gatePivot);
let ring,sensorPos=new THREE.Vector3(),keyPos=new THREE.Vector3();
let gun=null,gunId='ar',COL=new THREE.Vector3(),BUTT=0;
const RY=.015; // rail centre (product y)
function build(id){
 gunId=id;const G=GUNS[id];
 [rail,cradle,lockBody,bolts,gunHolder].forEach(g=>g.clear());coverHinge.clear();gatePivot.clear();
 gun=buildGun(id);gun.position.set(-G.t,GY,0);gunHolder.add(gun);
 BUTT=-G.t;COL.set(G.cx-G.t,G.cy+GY,0);
 /* rail: slotted channel, butt to past the barrel lock */
 const x0=BUTT-.05,x1=COL.x+.12,L=x1-x0,cx=(x0+x1)/2;
 rail.add(at(rbox(L,.075,.008,.003,shellM),cx,RY,WZ+.004));
 rail.add(at(rbox(L,.008,.03,.003,shellM),cx,RY+.0335,WZ+.015),at(rbox(L,.008,.03,.003,shellM),cx,RY-.0335,WZ+.015));
 for(let x=x0+.06;x<x1-.04;x+=.07){rail.add(at(rbox(.028,.012,.002,.004,slotM),x,RY,WZ+.0085));}
 [x0+.03,cx-.15,cx+.15,x1-.03].forEach(x=>{bolts.add(at(cylZ(.005,.05,M.steel,12),x,RY,WZ-.015));bolts.add(at(cylZ(.009,.004,M.steel,6),x,RY,WZ+.01));});
 /* stock cradle: floor plate + front lip + arm into rail */
 const cyc=.02,cw=.16,fz=.055;
 cradle.add(at(rbox(.014,cw,fz-WZ,.004,shellM),BUTT-.008,cyc,(WZ+fz)/2));
 cradle.add(at(rbox(.075,cw,.012,.004,shellM),BUTT+.03,cyc,fz-.006));
 cradle.add(at(rbox(.075,.012,fz-WZ,.004,shellM),BUTT+.03,cyc-cw/2+.006,(WZ+fz)/2),at(rbox(.075,.012,fz-WZ,.004,shellM),BUTT+.03,cyc+cw/2-.006,(WZ+fz)/2));
 cradle.add(at(box(.07,cw-.03,.004,feltM),BUTT+.03,cyc,fz-.013));
 /* trigger cover: fixed arm on the rail + hinged shell around the guard */
 const tw=.075,ty0=-.07,ty1=-.005,tz0=-.032,tz1=.042;
 cover.add(at(rbox(tw,.04,tz0-WZ+.01,.004,shellM),0,RY-.005,(WZ+tz0)/2));
 coverHinge.position.set(0,ty0,tz0);
 const h=ty1-ty0,d=tz1-tz0;
 coverHinge.add(at(rbox(tw,h,.01,.004,shellM),0,h/2,d));
 coverHinge.add(at(rbox(tw,.01,d,.004,shellM),0,.005,d/2));

function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(intro){const t=(now-i0)/1000;camera.position.set(Math.sin(t*.12)*1.5+.5,1.5+Math.sin(t*.2)*.05,3.4-Math.cos(t*.12)*.3);controls.target.set(fx,fy,0);}
 if(tw){const k=Math.min(1,(now-tw.s)/tw.d),e=ease(k);camera.position.lerpVectors(tw.p0,tw.p1,e);controls.target.lerpVectors(tw.t0,tw.t1,e);if(k>=1)tw=null;}
 offK+=(offT-offK)*Math.min(1,dt*6);const w=innerWidth,h=innerHeight;if(offK>.001)camera.setViewOffset(w,h,0,h*.14*offK,w,h);else camera.clearViewOffset();camera.updateProjectionMatrix();
 open+=(openT-open)*Math.min(1,dt*9);coverHinge.rotation.x=open*1.3;
 gateA+=(gateT-gateA)*Math.min(1,dt*11);gatePivot.rotation.x=-gateA*1.9;
 const rt=(now-ringT0)/1000;ringM.emissive.copy(RC[ringMode]);ringM.emissiveIntensity=ringMode==='idle'?.9+.5*Math.sin(now/700):ringMode==='scan'?1.3+1.2*Math.abs(Math.sin(rt*18)):ringMode==='ok'?3:(Math.sin(rt*22)>0?3.2:.3);
 const st=(now-shakeT)/1000;const sh=st<.45?Math.sin(st*70)*.004*(1-st/.45):0;product.position.x=(S.mount==='wall'?fx:-.18)+sh;
 controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__room={unlock,view,S,place};
