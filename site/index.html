<style>
:root{--ivory:#F2EDE4;--ink:#15130F;--bronze:#9C7A4E;--line:rgba(242,237,228,.14);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0c0a;color:var(--ivory);font-family:var(--sans);font-weight:300;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--sans);cursor:pointer;border:0;background:none;color:inherit}
.kick{font:500 9.5px/1 var(--sans);letter-spacing:.38em;text-transform:uppercase;color:var(--bronze)}
#title{position:fixed;left:36px;top:30px;z-index:5;pointer-events:none}
#title .logo{display:flex;align-items:center;gap:12px;font:400 19px/1 var(--serif);letter-spacing:.42em;margin-bottom:34px}
#title .logo svg{width:30px;height:18px;color:var(--bronze)}
#title h1,#title p,#spec{text-shadow:0 1px 14px #000a}
#title h1{font:300 54px/.98 var(--serif);margin:14px 0 12px}
#title h1 em{color:#d9c3a0}
#title p{max-width:300px;font-size:12.5px;line-height:1.7;color:#f2ede4a0}
#spec{position:fixed;right:36px;top:34px;z-index:5;width:230px}
#spec .row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font-size:11px;color:#f2ede488}
#spec .row b{font:400 17px/1 var(--serif);color:var(--ivory)}
#spec .kick{margin-bottom:12px}
#bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:6;display:flex;gap:22px;align-items:flex-end;padding:16px 22px;background:#15130fcc;border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:calc(100vw - 24px);overflow-x:auto}
.grp{display:flex;flex-direction:column;gap:9px;flex:none}
.grp .kick{font-size:8.5px}
.chips{display:flex;gap:4px}
.chips button{padding:9px 11px;border:1px solid var(--line);font:400 9.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#f2ede4b0;transition:.2s;white-space:nowrap}
.chips button:hover{color:var(--ivory);border-color:#f2ede455}
.chips button.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.chips button.main{background:var(--bronze);border-color:var(--bronze);color:#fff}
.sws{display:flex;gap:9px;padding:2px 0}
.sws button{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px #ffffff26;outline:1px solid transparent;outline-offset:3px}
.sws button.on{outline-color:var(--ivory)}
.sep{width:1px;align-self:stretch;background:var(--line);flex:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}
.lab{position:absolute;transform:translate(-50%,-50%);transition:opacity .4s}
.lab .dot{width:22px;height:22px;border-radius:50%;background:#15130fd0;border:1px solid var(--bronze);color:var(--ivory);font:500 10px/20px var(--sans);text-align:center;pointer-events:auto;cursor:pointer;transition:.2s}
.lab .dot:hover,.lab.open .dot{background:var(--bronze)}
.lab .card{position:absolute;left:30px;top:var(--ty,-6px);width:210px;padding:13px 15px;background:var(--ivory);color:var(--ink);opacity:0;transform:translateX(-6px);transition:.3s;pointer-events:none}
.lab.open .card,body.explode .lab .card{opacity:1;transform:none}
body.explode .lab .card p{display:none}
body.explode .lab .card{padding:9px 12px;width:auto;white-space:nowrap}
.lab .card b{display:block;font:400 18px/1.1 var(--serif);margin-bottom:4px}
.lab .card p{font-size:11px;line-height:1.5;color:#15130fa8}
body.nolabels .lab{opacity:0}
#toast{position:fixed;top:30px;left:50%;transform:translate(-50%,-8px);z-index:8;padding:13px 20px;background:#15130fe0;border:1px solid #9c7a4e77;font:400 10px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;opacity:0;transition:.4s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.deny{border-color:#c0503a}
#hint{position:fixed;left:36px;bottom:40px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#f2ede455;z-index:5}
@media (max-width:980px){#spec{display:none}}
@media (max-width:720px){#title{left:20px;top:20px}#title h1,#title p,#spec{text-shadow:0 1px 14px #000a}
#title h1{font-size:36px}#title p{display:none}#title .logo{margin-bottom:18px}#hint{display:none}#bar{bottom:12px;gap:14px;padding:12px 14px}}

/* app look */
#title{top:calc(84px + env(safe-area-inset-top,0px));left:calc(28px + env(safe-area-inset-left,0px))}

.gpill:hover{background:rgba(242,237,228,.2)}
.gpill.light{background:#F2EDE4;color:#15130F;border-color:#F2EDE4}
html[lang=ar] .gpill{letter-spacing:0;font-size:13px}
#spec{top:calc(84px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));width:250px;padding:18px 20px 14px;border-radius:24px}
#spec .row{border-top:1px solid rgba(255,255,255,.1)}
#spec .more{width:100%;margin-top:10px;height:38px;border-radius:999px;background:rgba(255,255,255,.08);font:500 10px/1 Jost,var(--arab);letter-spacing:.2em;text-transform:uppercase;color:#F2EDE4}
html[lang=ar] #spec .more{letter-spacing:0;font-size:12px}
#bar{border-radius:26px;padding:12px 14px 14px;gap:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));scrollbar-width:none;background:var(--g-dark)}
#bar::-webkit-scrollbar{display:none}
.chips{gap:6px}
.chips button{border-radius:999px;padding:10px 14px;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.04)}
.chips button.main{background:#9C7A4E;border-color:#9C7A4E}
.sws button{width:28px;height:28px}
.lab .card{border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.lab .dot{width:26px;height:26px;line-height:24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(21,19,15,.55)}
html[dir=rtl] #title{left:auto;right:calc(28px + env(safe-area-inset-right,0px));text-align:right}
html[dir=rtl] #spec{right:auto;left:calc(20px + env(safe-area-inset-left,0px))}
html[dir=rtl] .lab .card{left:auto;right:34px}
html[dir=rtl] #hint{left:auto;right:36px}
html[lang=ar] #title h1{font:500 40px/1.3 var(--arab)}
html[lang=ar] .chips button,html[lang=ar] .kick{letter-spacing:0!important;text-transform:none}
html body #toast{top:calc(76px + env(safe-area-inset-top,0px))}
html body #chatfab{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
@media (max-width:720px){
 #title{top:calc(76px + env(safe-area-inset-top,0px));left:18px;right:18px}#title h1{font-size:34px}html[lang=ar] #title h1{font-size:28px}
 #title p{display:block;font-size:12px}#title .cta{margin-top:12px}.gpill{height:38px;padding:0 14px}

}
@media (orientation:landscape) and (max-height:520px){

 #title{top:calc(70px + env(safe-area-inset-top,0px))}#title h1{font-size:24px;margin:0}html[lang=ar] #title h1{font-size:20px}#title .cta{margin-top:10px}
 #bar{left:auto;right:calc(10px + env(safe-area-inset-right,0px));transform:none;max-width:46vw;bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:8px 10px 10px}
 html body #chatfab{bottom:calc(16px + env(safe-area-inset-bottom,0px));right:auto;left:calc(16px + env(safe-area-inset-left,0px))}
 html body #appbar{height:44px;top:calc(6px + env(safe-area-inset-top,0px))}
}

import * as THREE from 'three';

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.02,40);camera.position.set(.15,.06,1.75);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;
controls.target.set(.2,0,0);controls.minDistance=.2;controls.maxDistance=5;controls.minAzimuthAngle=-1.45;controls.maxAzimuthAngle=1.45;controls.autoRotateSpeed=.8;

/* textures */
const rnd=(a,b)=>a+Math.random()*(b-a);
function ctex(w,h,draw,rep=[1,1]){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const plaster=ctex(512,512,(x,w,h)=>{x.fillStyle='#ececec';x.fillRect(0,0,w,h);for(let i=0;i<260;i++){const r=rnd(20,90),px=rnd(0,w),py=rnd(0,h),g=x.createRadialGradient(px,py,0,px,py,r);const v=Math.random()>.5?255:200;g.addColorStop(0,`rgba(${v},${v},${v},${rnd(.04,.1)})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2);}const d=x.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){const n=rnd(-9,9);d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n;}x.putImageData(d,0,0);},[2,1.2]);
const grain=ctex(512,128,(x,w,h)=>{x.fillStyle='#d8d8d8';x.fillRect(0,0,w,h);for(let i=0;i<70;i++){x.strokeStyle=`rgba(${rnd(80,140)|0},${rnd(60,100)|0},40,${rnd(.12,.32)})`;x.lineWidth=rnd(.5,2.2);x.beginPath();let y=rnd(0,h);x.moveTo(0,y);for(let X=0;X<=w;X+=16){y+=rnd(-1.6,1.6);x.lineTo(X,y);}x.stroke();}});
const engrave=ctex(256,128,(x,w,h)=>{x.fillStyle='#e8e8e8';x.fillRect(0,0,w,h);x.strokeStyle='rgba(60,60,60,.55)';for(let i=0;i<46;i++){x.lineWidth=rnd(.5,1.4);x.beginPath();x.arc(rnd(0,w),rnd(0,h),rnd(6,22),rnd(0,6),rnd(0,6));x.stroke();}});
const brushed=ctex(512,64,(x,w,h)=>{x.fillStyle='#dcdcdc';x.fillRect(0,0,w,h);for(let i=0;i<500;i++){x.strokeStyle=`rgba(${Math.random()>.5?255:150},${Math.random()>.5?255:150},${Math.random()>.5?255:150},.06)`;x.beginPath();const y=rnd(0,h);x.moveTo(0,y);x.lineTo(w,y+rnd(-.5,.5));x.stroke();}});
const wordTex=ctex(512,64,(x,w,h)=>{x.fillStyle='#efe6d6';x.font='400 36px "Cormorant Garamond", Georgia, serif';x.textAlign='center';x.textBaseline='middle';x.fillText('L  O  C  K  G',w/2,h/2+2);});

/* materials */
const M={walnut:new THREE.MeshStandardMaterial({color:0x4a2a16,map:grain,roughness:.36}),steel:new THREE.MeshStandardMaterial({color:0x26272a,metalness:.88,roughness:.36}),blued:new THREE.MeshStandardMaterial({color:0x1b1f27,metalness:.92,roughness:.28}),silver:new THREE.MeshStandardMaterial({color:0xb0aea7,map:engrave,metalness:1,roughness:.3}),brass:new THREE.MeshStandardMaterial({color:0xa6824d,metalness:1,roughness:.3}),poly:new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.72}),rubber:new THREE.MeshStandardMaterial({color:0x111111,roughness:.9})};
const shellM=new THREE.MeshPhysicalMaterial({color:0x8a6a43,metalness:.95,roughness:.3,map:brushed,clearcoat:.3,clearcoatRoughness:.3});
const darkM=new THREE.MeshStandardMaterial({color:0x121110,metalness:.6,roughness:.45});
const feltM=new THREE.MeshStandardMaterial({color:0x2a211a,roughness:1});

/* helpers */
function mesh(g,m){const o=new THREE.Mesh(g,m);o.castShadow=o.receiveShadow=true;return o;}
function at(o,x,y,z=0){o.position.set(x,y,z);return o;}
function rbox(w,h,d,r,m){return mesh(new RoundedBoxGeometry(w,h,d,4,r),m);}
function box(w,h,d,m){return mesh(new THREE.BoxGeometry(w,h,d),m);}
